<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_33 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_33" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_33');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(width, height);
  container.appendChild(renderer.domElement);

  // Aegis Shield Geometry
  const geometry = new THREE.IcosahedronGeometry(1.2, 1);
  const material = new THREE.MeshPhongMaterial({
    color: 0x00a3ff,
    wireframe: true,
    transparent: true,
    opacity: 0.4,
    shininess: 100
  });
  const shield = new THREE.Mesh(geometry, material);
  scene.add(shield);

  // Core Pulse
  const coreGeo = new THREE.SphereGeometry(0.4, 32, 32);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0x00a3ff, transparent: true, opacity: 0.8 });
  const core = new THREE.Mesh(coreGeo, coreMat);
  scene.add(core);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0x00a3ff, 2);
  pointLight.position.set(2, 2, 5);
  scene.add(pointLight);

  camera.position.z = 4;

  let mouseX = 0, mouseY = 0;
  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  function animate() {
    requestAnimationFrame(animate);
    const time = Date.now() * 0.001;
    
    shield.rotation.y += 0.005;
    shield.rotation.x += 0.002;
    
    // React to mouse
    shield.position.x += (mouseX * 0.5 - shield.position.x) * 0.05;
    shield.position.y += (mouseY * 0.5 - shield.position.y) * 0.05;
    
    core.scale.setScalar(1 + Math.sin(time * 4.0) * 0.1);
    core.material.opacity = 0.6 + Math.sin(time * 4.0) * 0.2;
    
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  animate();
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_33 -->
</body>
</html>
