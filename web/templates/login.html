<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>AEGIS-Security Login Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#ff6b00",
                        "accent": "#ff8a00",
                        "background": "#080808"
                    }
                }
            }
        }
    </script>
    <style>
        * {
            cursor: none !important;
        }
        body {
            background-color: #080808;
            font-family: 'JetBrains Mono', monospace;
        }
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            background-color: #ff6b00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ff6b00, 0 0 20px #ff6b00;
        }
        .custom-cursor-trail {
            position: fixed;
            top: 0;
            left: 0;
            width: 22px;
            height: 22px;
            border: 1.5px solid rgba(255, 107, 0, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            transition: transform 0.06s cubic-bezier(0.25, 1, 0.5, 1);
            background: rgba(255, 107, 0, 0.04);
        }
        #neural-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const cursor = document.getElementById('custom-cursor');
            const trail = document.getElementById('custom-cursor-trail');
            if (cursor && trail) {
                document.addEventListener('mousemove', (e) => {
                    cursor.style.left = e.clientX + 'px';
                    cursor.style.top = e.clientY + 'px';
                    setTimeout(() => {
                        trail.style.left = e.clientX + 'px';
                        trail.style.top = e.clientY + 'px';
                    }, 40);
                });
            }
        });
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-white overflow-hidden relative">
    <canvas id="neural-bg-canvas"></canvas>
    <div id="custom-cursor" class="custom-cursor hidden md:block"></div>
    <div id="custom-cursor-trail" class="custom-cursor-trail hidden md:block"></div>

    <div class="w-full max-w-[420px] bg-[#121212]/80 border border-primary/20 backdrop-blur-md rounded-xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2" style="text-shadow: 0 0 10px rgba(255,107,0,0.3);">&gt; AEGIS_SEC</h1>
            <p class="text-xs text-primary font-bold uppercase tracking-widest animate-pulse">[SECURE_UPLINK_PROMPT]</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="p-3 bg-error/10 border border-error/20 text-error rounded text-xs mb-4 font-semibold text-center">
                        {{ msg }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-primary mb-1 uppercase tracking-wider">Operator Username</label>
                <input class="w-full bg-[#080808] border border-primary/20 rounded py-2.5 px-3 text-xs text-primary focus:border-primary focus:ring-0 outline-none font-code-sm" type="text" name="username" required autocomplete="off"/>
            </div>
            <div>
                <label class="block text-xs font-bold text-primary mb-1 uppercase tracking-wider">Access Token / Password</label>
                <input class="w-full bg-[#080808] border border-primary/20 rounded py-2.5 px-3 text-xs text-primary focus:border-primary focus:ring-0 outline-none font-code-sm" type="password" name="password" required autocomplete="off"/>
            </div>
            <button type="submit" class="w-full py-3 bg-primary text-black font-bold rounded hover:shadow-[0_0_12px_rgba(255,107,0,0.5)] transition-all text-xs tracking-wider cursor-pointer">
                ESTABLISH ACCESS LINK
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-on-surface-variant">
            No session credentials? <a href="/register" class="text-primary hover:underline font-bold">Register Operator</a>
        </div>
    </div>

    <!-- Starry night canvas background -->
    <script>
        (function() {
            const canvas = document.getElementById('neural-bg-canvas');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;
            const stars = [];
            let mx = -9999, my = -9999;
            document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
            class Star {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * 0.25;
                    this.vy = (Math.random() - 0.5) * 0.25;
                    this.radius = Math.random() * 1.5 + 0.5;
                    this.alpha = Math.random() * 0.8 + 0.2;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    if (mx !== -9999) {
                        const dx = mx - this.x; const dy = my - this.y; const d = Math.hypot(dx, dy);
                        if (d < 200) { const f = (200 - d) * 0.00035; this.x += dx * f; this.y += dy * f; }
                    }
                    if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
                }
                draw() {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 107, 0, ${this.alpha})`; ctx.fill();
                }
            }
            for (let i = 0; i < 60; i++) stars.push(new Star());
            function loop() {
                ctx.clearRect(0,0,w,h);
                stars.forEach(s => { s.update(); s.draw(); });
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>
</body>
</html>
